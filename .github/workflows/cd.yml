name: CD — Auto Release

on:
  push:
    branches:
      - release

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine next version
        id: version
        run: |
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -n1)
          MIN_VERSION="v2.0.0"

          if [ -z "$LATEST" ]; then
            NEXT="$MIN_VERSION"
          else
            VERSION="${LATEST#v}"
            MAJOR=$(echo $VERSION | cut -d. -f1)
            MINOR=$(echo $VERSION | cut -d. -f2)
            PATCH=$(echo $VERSION | cut -d. -f3)
            NEXT="v${MAJOR}.${MINOR}.$((PATCH + 1))"
          fi

          if [[ "$(echo -e "$NEXT\n$MIN_VERSION" | sort -V | head -n1)" == "$NEXT" && "$NEXT" != "$MIN_VERSION" ]]; then
            NEXT="$MIN_VERSION"
          fi

          echo "next_version=$NEXT" >> $GITHUB_OUTPUT
          echo "Next version: $NEXT"

      - name: Create project zip
        run: |
          VERSION=${{ steps.version.outputs.next_version }}
          zip -r "project-${VERSION}.zip" src/ README.md
            

      - name: Create tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag ${{ steps.version.outputs.next_version }}
          git push origin ${{ steps.version.outputs.next_version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_version }}
          name: Release ${{ steps.version.outputs.next_version }}
          body: |
            Automated release triggered by merge to `release` branch.
            Commit: ${{ github.sha }}
          files: project-${{ steps.version.outputs.next_version }}.zip
          draft: false
          prerelease: false